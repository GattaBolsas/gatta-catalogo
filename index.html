<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATTA — Catálogo</title>
<style>
:root{--bg:#090909;--card:#141414;--gold:#b08d3b;--gold2:#dec47f;--text:#f7f2e8;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#171717,#090909 58%);color:var(--text);font-family:Arial,sans-serif;display:flex;flex-direction:column}
header{padding:28px 18px;text-align:center;border-bottom:1px solid #292929}
.logo{font-family:Georgia,serif;letter-spacing:8px;font-size:38px;color:var(--gold2);font-weight:bold}
.sub{font-size:10px;letter-spacing:3px;color:var(--gold);margin-top:6px}
main{width:100%;max-width:900px;margin:auto;padding:42px 20px 60px}
.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.category{min-height:330px;background:linear-gradient(145deg,#181818,#101010);border:1px solid #353535;border-radius:16px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.2s;padding:24px}
.category:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 35px rgba(0,0,0,.35)}
.icon{font-size:112px;line-height:1;margin-bottom:24px}
.category strong{font-family:Georgia,serif;font-size:34px;letter-spacing:3px;color:var(--gold2)}
.category span{font-size:12px;color:var(--muted);margin-top:10px}
.payment{text-align:center;color:#c9b98f;font-size:13px;line-height:1.6;margin-top:32px}
footer{text-align:center;padding:24px;border-top:1px solid #292929;color:#777;font-size:12px}
@media(max-width:650px){
  main{padding:28px 16px 45px}
  .category-grid{grid-template-columns:1fr;gap:16px}
  .category{min-height:230px}
  .icon{font-size:82px;margin-bottom:17px}
  .category strong{font-size:27px}
}
</style>
</head>
<body>
<header><div class="logo">GATTA</div><div class="sub">BOLSAS E ACESSÓRIOS</div></header>
<main>
<div class="category-grid">
<a class="category" href="bolsas.html">
<div class="icon">👜</div>
<strong>BOLSAS</strong>
<span>Ver produtos</span>
</a>
<a class="category" href="carteiras.html">
<div class="icon">👛</div>
<strong>CARTEIRAS</strong>
<span>Ver produtos</span>
</a>
</div>
<div class="payment">Parcelamento em até 12x no cartão de crédito — consulte as taxas pelo WhatsApp.</div>
</main>
<footer>GATTA • Bolsas e Acessórios</footer>
</body>
</html>
